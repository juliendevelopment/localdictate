name: Android Release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Parse release version
        id: version
        run: python3 ../scripts/android_release_version.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Require reviewed main commit and green build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow android-build.yml --branch main --commit "$GITHUB_SHA" --json headSha,conclusion > "$RUNNER_TEMP/build-checks.json"
          python3 -c 'import json,os; from pathlib import Path; runs=json.loads((Path(os.environ["RUNNER_TEMP"])/"build-checks.json").read_text()); assert any(r["headSha"]==os.environ["GITHUB_SHA"] and r["conclusion"]=="success" for r in runs), "No green main Android Build for this exact SHA"'
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate release tooling
        run: python3 -m unittest discover -s ../scripts -p 'test_*.py'
      - name: Require and decode dedicated signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          python3 -c 'import os,base64; from pathlib import Path; names=["SIGNING_KEYSTORE_BASE64","SIGNING_STORE_PASSWORD","SIGNING_KEY_ALIAS","SIGNING_KEY_PASSWORD"]; assert all(os.environ.get(n) for n in names), "Missing required signing secrets"; key=Path(os.environ["RUNNER_TEMP"])/"localdictate-release.p12"; fd=os.open(key,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); out=os.fdopen(fd,"wb"); out.write(base64.b64decode(os.environ["SIGNING_KEYSTORE_BASE64"],validate=True)); out.close(); env=Path(os.environ["GITHUB_ENV"]); env.open("a").write("SIGNING_STORE_FILE="+str(key)+"\n")'
      - name: Tests, lint and signed release build
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=2 --console=plain testDebugUnitTest lintDebug assembleRelease
      - name: Verify signed APK
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Prepare release files
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 -c 'from pathlib import Path; import os,hashlib,shutil; out=Path(os.environ["RUNNER_TEMP"])/"delivery"; out.mkdir(); apk=out/("LocalDictate-v"+os.environ["VERSION_NAME"]+".apk"); shutil.copyfile("app/build/outputs/apk/release/app-release.apk",apk); (out/"SHA256SUMS").write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+"  "+apk.name+"\n")'
      - name: Publish new private release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "LocalDictate v$VERSION_NAME" --notes-file "../docs/releases/v$VERSION_NAME.md" "$RUNNER_TEMP/delivery/LocalDictate-v$VERSION_NAME.apk" "$RUNNER_TEMP/delivery/SHA256SUMS"
      - name: Remove temporary key
        if: always()
        run: python3 -c 'from pathlib import Path; import os; (Path(os.environ["RUNNER_TEMP"])/"localdictate-release.p12").unlink(missing_ok=True)'
